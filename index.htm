<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание · Вова</title>
<style>
:root {
  --bg: #0b1220;
  --surface: #111827;
  --surface-2: #1f2937;
  --text: #e5e7eb;
  --muted: #94a3b8;
  --accent: #f59e0b;
  --next-bg: #1f2937;
  --next-text: #f9fafb;
  --link: #93c5fd;
  --cell-text: #1f2937;
  --cell-border: rgba(255,255,255,0.04);
}
[data-theme="light"] {
  --bg: #fafafa;
  --surface: #ffffff;
  --surface-2: #f3f4f6;
  --text: #111827;
  --muted: #6b7280;
  --accent: #2563eb;
  --next-bg: #1f2937;
  --next-text: #f9fafb;
  --link: #2563eb;
  --cell-text: #374151;
  --cell-border: rgba(0,0,0,0.04);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  transition: background .2s, color .2s;
}
main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 20px 60px;
}
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
h1 { margin: 0; font-size: 18px; font-weight: 500; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
.theme-toggle {
  background: var(--surface);
  border: 1px solid var(--cell-border);
  color: var(--text);
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
  font-size: 14px;
}
.theme-toggle:hover { background: var(--surface-2); }
.cards {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}
@media (max-width: 720px) { .cards { grid-template-columns: 1fr; } }
.now-card, .next-card {
  padding: 24px;
  border-radius: 20px;
}
.now-card { color: #1f2937; }
.now-card .label,
.next-card .label {
  font-size: 13px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  opacity: 0.7;
}
.now-card .activity { font-size: 42px; margin-top: 8px; font-weight: 600; }
.next-card { background: var(--next-bg); color: var(--next-text); }
.next-card .name { font-size: 24px; margin-top: 8px; font-weight: 600; }
.next-card .when { opacity: 0.8; margin-top: 4px; }
.next-card a { color: var(--link); margin-top: 10px; display: inline-block; }
.week-title { font-size: 20px; font-weight: 600; margin: 12px 0; }
table.schedule {
  border-collapse: separate;
  border-spacing: 6px;
  width: 100%;
}
.schedule th {
  padding: 10px 6px;
  font-weight: 500;
  color: var(--muted);
  font-size: 12px;
}
.schedule th.today {
  color: var(--accent);
  font-weight: 600;
  border-bottom: 2px solid var(--accent);
}
.schedule td.time {
  padding: 6px 10px;
  color: var(--muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.schedule tr.current td.time {
  color: var(--accent);
  font-weight: 600;
  border-right: 2px solid var(--accent);
}
.schedule td.cell {
  padding: 14px 6px;
  border-radius: 12px;
  border: 1px solid var(--cell-border);
  text-align: center;
  line-height: 1.2;
  transition: transform .15s;
}
.schedule td.cell.in-cross { border-color: rgba(245,158,11,0.33); }
[data-theme="light"] .schedule td.cell.in-cross { border-color: rgba(37,99,235,0.33); }
.schedule td.cell.now {
  border: 2px solid var(--accent);
  box-shadow: 0 0 0 4px rgba(245,158,11,0.18), 0 4px 14px rgba(0,0,0,0.25);
}
[data-theme="light"] .schedule td.cell.now {
  box-shadow: 0 0 0 4px rgba(37,99,235,0.18), 0 4px 14px rgba(0,0,0,0.15);
}
.cell .emoji { font-size: 20px; color: var(--cell-text); }
.cell .code { font-size: 10px; color: var(--cell-text); margin-top: 2px; font-weight: 500; }
.events {
  margin-top: 32px;
  padding: 24px;
  background: var(--surface);
  border-radius: 16px;
}
.events h2 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
.event { padding: 8px 0; border-top: 1px solid var(--cell-border); }
.event:first-of-type { border-top: 0; }
.event .name { font-weight: 600; }
.event .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
footer {
  text-align: center;
  margin-top: 32px;
  color: var(--muted);
  font-size: 12px;
}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <h1>Расписание</h1>
    <button class="theme-toggle" id="theme-toggle">🌙 Тёмная</button>
  </div>
  <div class="cards">
    <div class="now-card" id="now-card"></div>
    <div class="next-card" id="next-card"></div>
  </div>
  <div class="week-title" id="week-title"></div>
  <table class="schedule" id="schedule"></table>
  <div class="events">
    <h2>Постоянные события</h2>
    <div id="events"></div>
  </div>
  <footer id="footer"></footer>
</main>

<script>
const DATA = {
  "timezone": "Asia/Omsk",
  "activities": {
    "SLEEP": {"label": "Сон",                       "color": "#b0c4de", "emoji": "🛏️"},
    "MEAL":  {"label": "Еда",                       "color": "#fef3e4", "emoji": "🍽️"},
    "ENG":   {"label": "Английский (Skyeng)",       "color": "#ffe0b2", "emoji": "🇬🇧", "link": "https://student.skyeng.ru/"},
    "DOGS":  {"label": "Выставка собак (с мамой)",  "color": "#d7ccc8", "emoji": "🐕"},
    "GAME":  {"label": "Игры с Викой",              "color": "#fcd7e7", "emoji": "🎮"},
    "TMF":   {"label": "Время с Викой",             "color": "#f8bbd0", "emoji": "❤️"},
    "FREE":  {"label": "Свободно",                  "color": "#f0f8ff", "emoji": "🕊️"}
  },
  "weeks": [
    {
      "name": "Обычная неделя",
      "rows": [
        {"time": "00:00", "activities": ["SLEEP","SLEEP","SLEEP","SLEEP","SLEEP","SLEEP","SLEEP"]},
        {"time": "10:00", "activities": ["SLEEP","SLEEP","SLEEP","SLEEP","SLEEP","DOGS", "SLEEP"]},
        {"time": "12:00", "activities": ["MEAL", "MEAL", "MEAL", "MEAL", "MEAL", "DOGS", "MEAL"]},
        {"time": "13:00", "activities": ["FREE", "FREE", "FREE", "FREE", "FREE", "DOGS", "FREE"]},
        {"time": "15:00", "activities": ["MEAL", "MEAL", "MEAL", "MEAL", "MEAL", "FREE", "MEAL"]},
        {"time": "16:00", "activities": ["FREE", "FREE", "FREE", "FREE", "FREE", "FREE", "FREE"]},
        {"time": "20:00", "activities": ["FREE", "FREE", "ENG",  "FREE", "ENG",  "FREE", "FREE"]},
        {"time": "21:00", "activities": ["MEAL", "MEAL", "MEAL", "MEAL", "MEAL", "TMF",  "TMF"]},
        {"time": "22:00", "activities": ["TMF",  "TMF",  "TMF",  "TMF",  "TMF",  "GAME", "TMF"]},
        {"time": "23:00", "activities": ["SLEEP","SLEEP","SLEEP","SLEEP","SLEEP","SLEEP","SLEEP"]}
      ]
    }
  ],
  "fixed_events": [
    {"name": "Английский Skyeng", "days": ["Ср","Пт"], "time": "20:00", "url": "https://student.skyeng.ru/"},
    {"name": "Выставка собак",    "days": ["Сб"],     "time": "10:00", "with": "мама"}
  ]
};
const DAYS_RU = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];

// ---------- Theme ----------
const root = document.documentElement;
const toggleBtn = document.getElementById("theme-toggle");
function applyTheme(t) {
  root.setAttribute("data-theme", t);
  toggleBtn.textContent = t === "dark" ? "🌙 Тёмная" : "☀️ Светлая";
  localStorage.setItem("theme", t);
}
applyTheme(localStorage.getItem("theme") || "dark");
toggleBtn.onclick = () => applyTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");

// ---------- Time helpers (Omsk = UTC+6) ----------
function nowOmsk() {
  const utc = new Date();
  return new Date(utc.getTime() + (utc.getTimezoneOffset() + 6 * 60) * 60000);
}
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  const dn = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dn);
  const ys = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil((((t - ys) / 86400000) + 1) / 7);
}
function pickWeek(now) {
  const weeks = DATA.weeks;
  if (weeks.length === 1) return weeks[0];
  return isoWeek(now) % 2 === 1 ? weeks[0] : weeks[1];
}
function currentSlot(week, now) {
  const wd = (now.getUTCDay() + 6) % 7; // Mon=0
  const hhmm = String(now.getUTCHours()).padStart(2,"0") + ":" + String(now.getUTCMinutes()).padStart(2,"0");
  let idx = 0;
  for (let i = 0; i < week.rows.length; i++) if (week.rows[i].time <= hhmm) idx = i;
  return { slot: idx, day: wd };
}

// ---------- Render ----------
function render() {
  const now = nowOmsk();
  const week = pickWeek(now);
  const { slot, day } = currentSlot(week, now);
  const code = week.rows[slot].activities[day];
  const act = DATA.activities[code];

  // Now card
  document.getElementById("now-card").style.background = act.color;
  document.getElementById("now-card").innerHTML = `
    <div class="label">Сейчас · ${DAYS_RU[day]} ${String(now.getUTCHours()).padStart(2,"0")}:${String(now.getUTCMinutes()).padStart(2,"0")} · Омск</div>
    <div class="activity">${act.emoji} ${act.label}</div>
  `;

  // Next event
  let soonest = null, best = null;
  for (const ev of DATA.fixed_events) {
    for (const d of ev.days) {
      const targetDay = DAYS_RU.indexOf(d);
      let off = (targetDay - day + 7) % 7;
      const [h, m] = ev.time.split(":").map(Number);
      const cand = new Date(now);
      cand.setUTCHours(h, m, 0, 0);
      cand.setUTCDate(cand.getUTCDate() + off);
      if (off === 0 && cand <= now) cand.setUTCDate(cand.getUTCDate() + 7);
      if (!soonest || cand < soonest) { soonest = cand; best = ev; }
    }
  }
  if (best) {
    const diff = soonest - now;
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const when = h ? `через ${h}ч ${m}м` : `через ${m}м`;
    const link = best.url ? `<a href="${best.url}" target="_blank">↗ открыть</a>` : "";
    const evDay = (soonest.getUTCDay() + 6) % 7;
    document.getElementById("next-card").innerHTML = `
      <div class="label">Следующее</div>
      <div class="name">${best.name}</div>
      <div class="when">${DAYS_RU[evDay]} ${String(soonest.getUTCHours()).padStart(2,"0")}:${String(soonest.getUTCMinutes()).padStart(2,"0")} · ${when}</div>
      <div>${link}</div>
    `;
  }

  // Week title
  document.getElementById("week-title").textContent = week.name;

  // Grid
  let html = "<tr><th></th>";
  for (let i = 0; i < 7; i++) {
    html += `<th class="${i === day ? "today" : ""}">${DAYS_RU[i]}</th>`;
  }
  html += "</tr>";
  for (let r = 0; r < week.rows.length; r++) {
    const row = week.rows[r];
    const isCurR = r === slot;
    html += `<tr class="${isCurR ? "current" : ""}"><td class="time">${row.time}</td>`;
    for (let d = 0; d < 7; d++) {
      const c = row.activities[d];
      const a = DATA.activities[c];
      const isNow = isCurR && d === day;
      const inCross = isCurR || d === day;
      const cls = "cell" + (isNow ? " now" : (inCross ? " in-cross" : ""));
      html += `<td class="${cls}" style="background:${a.color}">
        <div class="emoji">${a.emoji}</div>
        <div class="code">${c}</div>
      </td>`;
    }
    html += "</tr>";
  }
  document.getElementById("schedule").innerHTML = html;

  // Events list
  document.getElementById("events").innerHTML = DATA.fixed_events.map(ev => {
    const extras = [];
    if (ev.with) extras.push(`с ${ev.with}`);
    if (ev.url) extras.push(`<a href="${ev.url}" target="_blank">${ev.url}</a>`);
    return `<div class="event">
      <div class="name">${ev.name}</div>
      <div class="meta">${ev.days.join(", ")} · ${ev.time} · ${extras.join(" · ")}</div>
    </div>`;
  }).join("");

  // Footer
  document.getElementById("footer").textContent =
    `Автообновление каждую минуту · ${now.toISOString().replace("T"," ").slice(0,16)} Омск`;
}

render();
setInterval(render, 60000);
</script>
</body>
</html>
